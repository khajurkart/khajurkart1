name: KhajurKart Backend Integration

on:
  push:
    branches:
      - feature/delivery-gateway
  workflow_dispatch:

jobs:
  verify:
    name: Verify FastAPI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Verify FastAPI imports and routes
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: khajurkart_integration_test
          JWT_SECRET: github-actions-test-secret
          RESEND_API_KEY: test-key
          RAZORPAY_KEY_ID: rzp_test_dummy
          RAZORPAY_KEY_SECRET: dummy-secret
        run: |
          python - <<'PY'
          from server import app

          routes = {
              (method, route.path)
              for route in app.routes
              for method in getattr(route, "methods", [])
          }

          required = [
              "/api/admin/delivery/summary",
              "/api/admin/delivery/partner-on-duty",
              "/api/admin/delivery/orders/{order_id}",
          ]

          for path in required:
              assert ("GET", path) in routes, (
                  f"Missing GET route: {path}"
              )
              print(f"PASS: GET {path}")

          print("FastAPI imported successfully.")
          print("All delivery routes registered.")
          PY

  mongodb_test:
    name: Verify MongoDB Atlas Connection
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MongoDB driver
        run: python -m pip install "pymongo[srv]"

      - name: Test database connection
        env:
          TEST_MONGO_URL: ${{ secrets.TEST_MONGO_URL }}
        run: |
          python - <<'PY'
          import os
          from uuid import uuid4
          from pymongo import MongoClient

          uri = os.environ.get("TEST_MONGO_URL")
          if not uri:
              raise RuntimeError("TEST_MONGO_URL secret is missing")

          client = MongoClient(
              uri,
              serverSelectionTimeoutMS=10000
          )

          try:
              client.admin.command("ping")
              print("PASS: MongoDB Atlas connection")

              db = client["khajurkart_integration_test"]
              collection = db["ci_connection_checks"]

              test_id = str(uuid4())

              collection.insert_one({
                  "_id": test_id,
                  "test": "khajurkart_ci"
              })

              try:
                  found = collection.find_one({"_id": test_id})
                  assert found is not None
                  print("PASS: Test database read/write")
              finally:
                  collection.delete_one({"_id": test_id})

              print("PASS: Test document cleanup")

          finally:
              client.close()
          PY
