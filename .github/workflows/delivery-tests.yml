
name: KhajurKart Delivery Gateway Tests

on:
  push:
    branches:
      - feature/delivery-gateway
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pymongo pydantic

      - name: Check Python syntax
        run: |
          python -m compileall -q delivery

      - name: Run gateway tests
        run: |
          python -m pytest -q \
            tests/test_order_safety.py \
            tests/test_delivery_gateway.py \
            tests/test_cod_reconciliation.py \
            tests/test_partner_rotation.py
